name: Deploy To GitHub Pages

on:
  push:
    branches:
      - main
  # Manual trigger, so a deployment can be verified without waiting for a push.
  workflow_dispatch:
  # A dependabot merge runs as `github-actions[bot]`, and a push made with
  # `GITHUB_TOKEN` starts no other workflow. The auto-merge workflow asks for the
  # deployment through this event instead, because a dependency bump can change
  # the bundled output even though the source did not move.
  repository_dispatch:
    types: [dependabot-merged]

# `pages: write` publishes the site and `id-token: write` lets the deployment
# prove it was started by this workflow. No token of any kind is stored: the
# site is uploaded as an artifact and published by `actions/deploy-pages`
# instead of being pushed to the `gh-pages` branch, so the build is a run of
# this workflow rather than a side effect of a branch push. `actions: write`
# lets the cleanup step below delete the artifact of an earlier attempt.
permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

# One deployment at a time. Cancelling a running one would publish a half
# written site, so a second run waits instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pre-built
        run: |
          npm ci
          npm run build:deployment

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # A rerun uploads under the same name again, and `deploy-pages` refuses to
      # pick between two artifacts named `github-pages`: it fails with `Multiple
      # artifacts ... were unexpectedly found`. Clear what an earlier attempt left
      # behind so the lookup below always sees exactly one. On a first attempt
      # there is nothing to delete.
      - name: Drop the artifact of an earlier attempt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          artifacts="repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts"
          for id in $(gh api --paginate "${artifacts}?name=github-pages" --jq '.artifacts[].id'); do
            echo "Deleting artifact ${id}."
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" >/dev/null
          done

      - name: Upload the build output
        uses: actions/upload-pages-artifact@v5
        with:
          path: .publish

      # `deploy-pages` lists this run's artifacts as soon as the upload step ends
      # and has been seen answering `Found 0 artifact(s)` a second later, although
      # the build and the upload had both succeeded: the new artifact was still
      # propagating. Poll the REST listing until it shows up instead of sleeping
      # for a guessed amount of time. That listing is served by a different service
      # than the one the action reads, so the deploy step still retries once.
      - name: Wait for the pages artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for attempt in $(seq 1 20); do
            total=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?name=github-pages" --jq '.total_count')
            if [ "$total" != "0" ]; then
              echo "The github-pages artifact is listed."
              exit 0
            fi

            echo "The github-pages artifact is not listed yet (attempt ${attempt}/20)"
            sleep 3
          done

          echo "::error::The github-pages artifact never appeared in the listing."
          exit 1

      # A failed lookup leaves the uploaded artifact in place, so a second attempt
      # a few seconds later is cheap and saves a manual rerun of the job.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
