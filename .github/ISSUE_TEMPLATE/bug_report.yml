name: Bug report
description: Create a report to help us improve
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so the issue can be triaged quickly.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The version of `@cycjimmy/canvas-snow` you are using.
      placeholder: 4.0.0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and OS, plus the way the library is loaded (bundler, ESM import, or the UMD build).
      placeholder: |
        Browser: Chrome 140
        OS: macOS 26
        Loading: bundled with Vite / UMD <script> tag
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior, or a minimal demo (repository / code sandbox) that shows the problem.
      placeholder: |
        1. Create an instance with '...'
        2. Call '...'
        3. See the error
      render: text
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Relevant configuration
      description: The options passed to the constructor, and the wrapper markup if the sizing looks wrong.
      render: js

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: The console output around the failure, if available.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
