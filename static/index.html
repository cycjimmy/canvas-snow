<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canvas Snow Demo</title>
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="shortcut icon" href="./favicon.ico">
</head>

<body>
<div class="snow-wrapper"></div>
<script type="module">
  // Relative on purpose: the dev server serves this file from static/ under the
  // project root, while `build:deployment` uses static/ as its Vite root.
  import CanvasSnow from '../src/index.ts'
  import '../src/styles/demo.scss'

  const canvasSnow = new CanvasSnow({
    context: '.snow-wrapper',
    cell: 30
  }).init();

  canvasSnow.start();
</script>
</body>
</html>
